name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare one-off release signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077

          # 仅为本次最终包生成临时签名；不依赖 GitHub Secrets。
          key_alias="aloye-final"
          store_password="$(openssl rand -hex 32)"
          key_password="${store_password}"

          keytool -genkeypair -v \
            -keystore app/app.key \
            -storetype JKS \
            -storepass "${store_password}" \
            -keypass "${key_password}" \
            -alias "${key_alias}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Aloye Personal,O=Personal,C=CN" \
            -noprompt

          printf 'storeFile=%s/app/app.key\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${GITHUB_WORKSPACE}" \
            "${store_password}" \
            "${key_alias}" \
            "${key_password}" > local.properties

          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          else
            printf '{}\n' > app/google-services.json
          fi

          echo "One-off release keystore generated: $(wc -c < app/app.key) bytes"

      - name: Gradle Release Build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner was not found in Android SDK."
            exit 1
          fi

          apk_count=0
          while IFS= read -r apk; do
            apk_count=$((apk_count + 1))
            echo "Verifying ${apk}"
            "${APKSIGNER}" verify --verbose "${apk}"
            sha256sum "${apk}"
          done < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)

          if [ "${apk_count}" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 使用独立 stable tag，避免用户继续下载旧 nightly Debug APK。
      - name: Publish stable prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: stable
          name: Stable Build
          prerelease: true
          overwrite_files: true
          body: |
            签名稳定版构建（commit `${{ github.sha }}`）

            - 使用仓库持久签名构建
            - 已通过 apksigner 签名验证
            - 这是测试版，仅供验证使用
          files: app/build/outputs/apk/release/*.apk
